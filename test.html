<!DOCTYPE html>
<html>
<style>
.btn-add-cart {
  background: #22c55e;
  color: white;
  border: none;
  padding: 0 0.8rem;
  height: 36px;
  line-height: 36px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.3s ease;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  white-space: nowrap;
  text-align: center;
}
.btn-add-cart:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}
</style>
<body>
<button class="btn-add-cart" disabled>Ajouté ! ✔</button>
</body>
</html>
